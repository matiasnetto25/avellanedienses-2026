<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="pedidos-content densidad-compacta">
  @if (cargando()) {
    <!-- El spinner global con el logo cubre la espera. -->
  } @else if (errorCarga()) {
    <div class="pedidos-aviso">
      <p class="pedidos-aviso-texto">No se pudieron cargar los pedidos.</p>
      <ion-button class="pedidos-aviso-boton" (click)="reintentar()">Reintentar</ion-button>
    </div>
  } @else if (pedidos().length === 0) {
    <div class="pedidos-aviso">
      <p class="pedidos-aviso-texto">No hay pedidos esperando confirmación.</p>
    </div>
  } @else {
    <div class="pedidos-lista">
      @for (pedido of pedidos(); track pedido.id) {
        <app-fila-pedido [pedido]="pedido" [conDetalle]="true" />
      }
    </div>
  }
</ion-content>
