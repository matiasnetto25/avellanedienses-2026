<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <app-marca-header [compacto]="true" />

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="login-campo">
        <ion-input
          type="email"
          class="campo"
          fill="outline"
          label-placement="floating"
          label="Correo electrónico"
          inputmode="email"
          formControlName="email"
          autocomplete="email"
          aria-describedby="login-email-aviso"
        ></ion-input>
        <app-aviso-campo id="login-email-aviso" [control]="form.controls['email']" [mensajes]="mensajesEmail" />
      </div>

      <div class="login-campo">
        <ion-input
          type="password"
          class="campo"
          fill="outline"
          label-placement="floating"
          label="Contraseña"
          formControlName="password"
          autocomplete="current-password"
          aria-describedby="login-password-aviso"
          (keyup.enter)="onSubmit()"
        ></ion-input>
        <app-aviso-campo id="login-password-aviso" [control]="form.controls['password']" [mensajes]="mensajesPassword" />
      </div>
    </form>

    <section class="ingreso-rapido" aria-labelledby="ingreso-rapido-titulo">
      <h2 id="ingreso-rapido-titulo" class="ingreso-rapido-titulo">Ingreso rápido</h2>
      <p class="ingreso-rapido-ayuda">Tocá un perfil para entrar directo.</p>
      <div class="perfiles">
        @for (usuario of usuariosDemo; track usuario.perfil) {
          <button
            type="button"
            class="perfil"
            [class.perfil--ancho]="$last && usuariosDemo.length % 2 === 1"
            [disabled]="cargando"
            (click)="autocompletar(usuario)"
          >
            <ion-icon [name]="usuario.icono" aria-hidden="true" />
            <span>{{ usuario.etiqueta }}</span>
          </button>
        }
      </div>
    </section>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <app-barra-acciones>
    <ion-button class="accion-principal" expand="block" [disabled]="cargando" (click)="onSubmit()">
      {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
    </ion-button>
  </app-barra-acciones>
</ion-footer>
