<ion-content [fullscreen]="true" [scrollY]="false" class="login-content">
  <div class="login-container">
    <div class="login-centro">
      <app-marca-header />

      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="login-campo">
          <ion-item class="login-item">
            <ion-label position="stacked">Correo electrónico</ion-label>
            <ion-input type="email" formControlName="email" autocomplete="email" (ionBlur)="onBlur('email')"></ion-input>
          </ion-item>
          @if (mensajeError('email'); as mensaje) {
            <ion-text color="danger" class="login-error">{{ mensaje }}</ion-text>
          }
        </div>

        <div class="login-campo">
          <ion-item class="login-item">
            <ion-label position="stacked">Contraseña</ion-label>
            <ion-input type="password" formControlName="password" autocomplete="current-password" (ionBlur)="onBlur('password')"></ion-input>
          </ion-item>
          @if (mensajeError('password'); as mensaje) {
            <ion-text color="danger" class="login-error">{{ mensaje }}</ion-text>
          }
        </div>

        <ion-button expand="block" type="submit" class="login-submit" [disabled]="form.invalid || cargando">Iniciar sesión</ion-button>
      </form>
    </div>

    <ion-button fill="clear" size="small" class="login-accesos-trigger" (click)="mostrarAccesoRapido = true">
      Usuarios de prueba
    </ion-button>
  </div>

  <ion-action-sheet
    header="Usuarios de prueba"
    [isOpen]="mostrarAccesoRapido"
    [buttons]="botonesAccesoRapido"
    (didDismiss)="mostrarAccesoRapido = false"
  ></ion-action-sheet>
</ion-content>
