<ion-header class="ion-no-border">
  <ion-toolbar>
    @if (!enPestana) {
      <ion-buttons slot="start">
        <ion-button (click)="volver()" aria-label="Volver">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
    <ion-title>Nuestro Menú{{ numeroMesa ? ' · Mesa ' + numeroMesa : '' }}</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment
      [value]="categoriaSeleccionada"
      (ionChange)="onCambioCategoria($event)"
    >
      <ion-segment-button value="comida">
        <ion-icon name="restaurant-outline"></ion-icon>
        <ion-label>Comida</ion-label>
      </ion-segment-button>
      <ion-segment-button value="bebida">
        <ion-icon name="wine-outline"></ion-icon>
        <ion-label>Bebidas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="postre">
        <ion-icon name="ice-cream-outline"></ion-icon>
        <ion-label>Postres</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="menu-content" appAlturaDisponible [margenAltura]="0" [descontarBarraGestos]="false">
  <div class="menu-lista">
    <div class="pagina-menu" *ngFor="let producto of productosFiltrados">
      <app-producto-card [producto]="producto"></app-producto-card>
    </div>
  </div>

  <p class="menu-vacio" *ngIf="!cargando && productosFiltrados.length === 0">
    No hay productos disponibles en esta categoría por el momento.
  </p>
</ion-content>
