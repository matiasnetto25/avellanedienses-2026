<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Personal</ion-title>
    <app-avatar-perfil slot="end" [nombre]="perfil()?.nombre ?? ''" [foto]="perfil()?.foto ?? null" />
  </ion-toolbar>
</ion-header>

<!-- Una tarjeta por página que ocupa TODO el alto visible (el relleno de 16 px ya
     viene dentro de cada página y el botón está en el footer, fuera del contenido),
     por eso no se descuenta nada: cualquier margen deja asomar la tarjeta siguiente. -->
<ion-content
  class="densidad-compacta modo-empleados"
  appAlturaDisponible
  [margenAltura]="0"
  [descontarBarraGestos]="false">
  <app-lista-empleados (editando)="editandoEmpleado.set($event)" />
</ion-content>

<!-- Mientras se edita un empleado no se ofrece dar de alta otro: la tarjeta ocupa todo el alto. -->
@if (!editandoEmpleado()) {
  <ion-footer class="ion-no-border">
    <app-barra-acciones>
      <ion-button class="accion-principal" expand="block" (click)="darDeAlta()">Dar de alta</ion-button>
    </app-barra-acciones>
  </ion-footer>
}
