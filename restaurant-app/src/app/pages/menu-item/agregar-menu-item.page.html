<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="rutaVolver" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="menu-item-content" appAlturaDisponible [margenAltura]="0" [descontarBarraGestos]="false">
  <form class="formulario" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    @if (!esCantinero) {
      <div class="campo-grupo">
        <ion-select
          class="campo"
          fill="outline"
          label-placement="floating"
          label="Tipo"
          interface="popover"
          formControlName="tipo"
          aria-describedby="tipo-aviso"
        >
          @for (t of tiposCocinero; track t.valor) {
            <ion-select-option [value]="t.valor">{{ t.etiqueta }}</ion-select-option>
          }
        </ion-select>
        <app-aviso-campo id="tipo-aviso" [control]="form.controls['tipo']" [mensajes]="mensajes" />
      </div>
    }

    <div class="campo-grupo">
      <ion-input
        class="campo"
        fill="outline"
        label-placement="floating"
        label="Nombre"
        formControlName="nombre"
        aria-describedby="nombre-aviso"
        autocomplete="off"
      ></ion-input>
      <app-aviso-campo id="nombre-aviso" [control]="form.controls['nombre']" [mensajes]="mensajes" />
    </div>

    <div class="campo-grupo">
      <ion-textarea
        class="campo"
        fill="outline"
        label-placement="floating"
        label="Descripción"
        formControlName="descripcion"
        [autoGrow]="true"
        rows="3"
        aria-describedby="descripcion-aviso"
      ></ion-textarea>
      <app-aviso-campo id="descripcion-aviso" [control]="form.controls['descripcion']" [mensajes]="mensajes" />
    </div>

    <div class="campos-contiguos">
      <div class="campo-grupo">
        <ion-input
          class="campo"
          fill="outline"
          label-placement="floating"
          label="Demora (minutos)"
          type="number"
          inputmode="numeric"
          formControlName="demora"
          aria-describedby="demora-aviso"
        ></ion-input>
        <app-aviso-campo id="demora-aviso" [control]="form.controls['demora']" [mensajes]="mensajes" />
      </div>

      <div class="campo-grupo">
        <ion-input
          class="campo"
          fill="outline"
          label-placement="floating"
          label="Precio"
          type="number"
          inputmode="decimal"
          formControlName="precio"
          aria-describedby="precio-aviso"
        ></ion-input>
        <app-aviso-campo id="precio-aviso" [control]="form.controls['precio']" [mensajes]="mensajes" />
      </div>
    </div>

    <!-- 3 fotos: un recuadro por foto, se toca para elegir cámara o galería -->
    <section class="fotos" aria-labelledby="fotos-titulo">
      <h2 id="fotos-titulo" class="fotos-titulo">Fotos</h2>
      <p class="ayuda">Tocá cada recuadro para tomar la foto o elegirla de la galería.</p>

      <div class="fotos-lista">
        @for (item of camposFoto; track item.campo) {
          <button
            type="button"
            class="foto-tile"
            [class.foto-tile--vacio]="!fotos()[item.campo]"
            [disabled]="camara.abriendo()"
            (click)="elegirFoto(item.campo)"
            [attr.aria-label]="(fotos()[item.campo] ? 'Reemplazar foto ' : 'Elegir foto ') + item.etiqueta.toLowerCase()"
          >
            @if (fotos()[item.campo]; as url) {
              <img [src]="url" [alt]="'Foto ' + item.etiqueta.toLowerCase()" />
              <span class="foto-tile-pie">{{ item.etiqueta }} · tocá para reemplazar</span>
            } @else {
              <span class="foto-tile-ayuda" aria-hidden="true">
                <ion-icon name="camera-outline" />
                <span>
                  {{ camara.abriendo() && campoEligiendo === item.campo ? 'Abriendo…' : 'Foto ' + item.etiqueta.toLowerCase() }}
                </span>
              </span>
            }
          </button>
        }
      </div>
    </section>
  </form>
</ion-content>

<ion-footer class="ion-no-border">
  <app-barra-acciones>
    <ion-button class="accion-principal" expand="block" [disabled]="cargando" (click)="onSubmit()">
      {{ cargando ? 'Guardando…' : 'Crear ' + (esCantinero ? 'bebida' : 'plato') }}
    </ion-button>
  </app-barra-acciones>
</ion-footer>
