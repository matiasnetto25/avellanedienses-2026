<ion-content [fullscreen]="true" [scrollY]="false" class="splash-content">
  <div class="splash-container">
    <div class="splash-icon-wrap">
      <img class="splash-icon" src="assets/icon/icon.png" alt="Ícono de {{ nombreApp }}" />
    </div>
    <div class="splash-rest">
      <h1 class="splash-nombre-app">{{ nombreApp }}</h1>
    </div>
  </div>
</ion-content>
